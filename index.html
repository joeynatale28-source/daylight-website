<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Daylight — landing page variants</title>
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<style>
:root{--bg:#ffffff;--surface:#f5f5f5;--card:#ffffff;--text:#171717;--muted:#737373;--faint:#a3a3a3;--line:#e5e5e5;--ghost:#d4d4d4}
@media (prefers-color-scheme:dark){:root{--bg:#121212;--surface:#282828;--card:#1e1e1e;--text:#e0e0e0;--muted:#a0a0a0;--faint:#757575;--line:#2c2c2c;--ghost:#333333}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;min-height:100svh;display:grid;place-items:center;padding:32px 16px;background:var(--bg);color:var(--text);font:400 17px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;transition:background-color 200ms linear,color 200ms linear}
main{width:100%;max-width:440px}
.brand{display:flex;align-items:center;justify-content:center;gap:9px;margin-bottom:28px;font-size:20px;font-weight:600;letter-spacing:-0.03em}
.brand svg{height:15px;width:auto}
ol{margin:0;padding:0;list-style:none;display:grid;gap:10px}
a{display:flex;align-items:center;gap:14px;min-height:50px;padding:6px 22px 6px 8px;border-radius:999px;border:1px solid var(--ghost);color:inherit;text-decoration:none;font-size:15px;font-weight:600;transition:background-color 200ms linear,border-color 200ms linear}
a:hover{background:var(--surface)}
a:focus-visible{outline:2px solid var(--text);outline-offset:3px}
b{flex:none;display:grid;place-items:center;width:36px;height:36px;border-radius:50%;background:var(--text);color:var(--bg);font-weight:600}
</style>
</head>
<body>
<main>
<div class="brand"><svg class="logo-mark" viewBox="36 170 426 188" aria-hidden="true"><path fill="currentColor" d="M100 326a149 149 0 0 1 298 0z"/><path fill="currentColor" d="M36 339h426v12H36z"/></svg><span>Daylight</span></div>
<ol>
<li><a href="1/"><b>1</b>Centered hero, two product windows</a></li>
<li><a href="2/"><b>2</b>Split hero, floating product cards</a></li>
<li><a href="3/"><b>3</b>Huge typography-led hero</a></li>
<li><a href="4/"><b>4</b>Editorial, full-width scroll sections</a></li>
<li><a href="5/"><b>5</b>Canvas bento grid, feature-led</a></li>
</ol>
</main>
</body>
</html>
